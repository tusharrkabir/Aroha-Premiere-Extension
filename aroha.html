<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aroha</title>
<style>
  :root{
    --bg:#05070d;
    --panel:#070b14;
    --cyan:#3fd8ff;
    --cyan-dim:#1c5f78;
    --purple:#7a5cff;
    --purple2:#b34cff;
    --text:#e8f2f8;
    --text-dim:#7d93a3;
    --border:#1c3a4a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .panel{
    width:420px;
    background:
      radial-gradient(ellipse at top left, rgba(122,92,255,0.08), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(63,216,255,0.06), transparent 50%),
      var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:22px 24px 26px;
    position:relative;
    box-shadow:0 0 40px rgba(63,216,255,0.06), inset 0 0 60px rgba(0,0,0,0.4);
  }

  /* header */
  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-bottom:16px;
    border-bottom:1px solid rgba(255,255,255,0.06);
    margin-bottom:20px;
  }
  .logo{
    font-size:26px;
    font-weight:600;
    letter-spacing:0.5px;
    background:linear-gradient(90deg,#5fe8ff,#8fb6ff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .header-icons{
    display:flex;
    align-items:center;
    gap:14px;
    color:var(--cyan);
  }
  .header-icons .divider{
    width:1px;
    height:18px;
    background:var(--border);
  }
  .icon-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--cyan);
    background:none;
    border:none;
    padding:2px;
    transition:filter .15s ease, transform .15s ease;
  }
  .icon-btn:hover{ filter:brightness(1.4); transform:scale(1.05); }
  .icon-btn.close{ color:#cfe3ee; }

  /* url input */
  .url-field{
    display:flex;
    align-items:center;
    gap:12px;
    border:1px solid var(--cyan-dim);
    border-radius:10px;
    padding:14px 16px;
    background:rgba(63,216,255,0.03);
    box-shadow:0 0 18px rgba(63,216,255,0.08) inset;
    margin-bottom:18px;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .url-field:focus-within{
    border-color:var(--cyan);
    box-shadow:0 0 22px rgba(63,216,255,0.22) inset;
  }
  .url-field svg{ flex-shrink:0; color:var(--cyan); }
  .url-field input{
    flex:1;
    background:none;
    border:none;
    outline:none;
    color:var(--text);
    font-size:15px;
    font-family:inherit;
  }
  .url-field input::placeholder{ color:var(--text-dim); }
  .url-field .divider{
    width:1px;
    height:18px;
    background:var(--border);
  }

  /* mode toggle */
  .mode-toggle{
    display:flex;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    margin-bottom:22px;
    background:rgba(255,255,255,0.015);
  }
  .mode-btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:15px 0;
    font-size:15px;
    font-weight:500;
    color:var(--text-dim);
    background:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    transition:color .2s ease, background .2s ease, clip-path .2s ease;
  }
  .mode-btn.active{
    color:#fff;
    background:linear-gradient(120deg, var(--purple), #4c6cff 90%);
    position:relative;
    z-index:1;
  }
  .mode-btn:first-child.active{
    clip-path:polygon(0 0, 92% 0, 100% 100%, 0% 100%);
  }
  .mode-btn:last-child.active{
    clip-path:polygon(8% 0, 100% 0, 100% 100%, 0% 100%);
  }
  .mode-btn:not(.active):hover{ color:var(--text); }

  /* section label */
  .section-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.5px;
    color:var(--cyan);
    margin-bottom:10px;
  }
  .section-label .dots{ color:var(--cyan-dim); letter-spacing:3px; font-size:10px; }
  .section-label .rule{
    flex:1;
    height:1px;
    background:linear-gradient(90deg, var(--border), transparent);
  }

  /* dropdown-style row */
  .field-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:20px;
    cursor:pointer;
    background:rgba(255,255,255,0.015);
    transition:border-color .2s ease;
  }
  .field-row:hover{ border-color:var(--cyan-dim); }
  .field-row .left{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:15px;
    color:var(--text);
  }
  .field-row .left svg{ color:var(--cyan); flex-shrink:0; }
  .field-row .right svg{ color:var(--cyan); }

  /* quality dropdown */
  .quality-menu{
    display:none;
    margin:-12px 0 20px;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    background:#060a11;
  }
  .quality-menu.open{ display:block; }
  .quality-menu div{
    padding:11px 16px;
    font-size:14px;
    color:var(--text-dim);
    cursor:pointer;
    border-top:1px solid rgba(255,255,255,0.04);
  }
  .quality-menu div:first-child{ border-top:none; }
  .quality-menu div:hover{ background:rgba(63,216,255,0.07); color:var(--text); }

  /* download button */
  .download-btn{
    position:relative;
    width:100%;
    padding:19px 0;
    border-radius:12px;
    border:1px solid var(--purple2);
    background:linear-gradient(120deg, rgba(179,76,255,0.35), rgba(63,216,255,0.25));
    color:#fff;
    font-size:16px;
    font-weight:700;
    letter-spacing:3px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    font-family:inherit;
    box-shadow:0 0 30px rgba(122,92,255,0.25), 0 0 30px rgba(63,216,255,0.1) inset;
    transition:transform .12s ease, box-shadow .2s ease;
  }
  .download-btn:hover{
    box-shadow:0 0 40px rgba(122,92,255,0.4), 0 0 34px rgba(63,216,255,0.18) inset;
    transform:translateY(-1px);
  }
  .download-btn:active{ transform:translateY(0px) scale(0.99); }
  .download-btn svg{ color:#dff6ff; }

  .download-btn.busy{ pointer-events:none; opacity:0.85; }
  .progress-fill{
    position:absolute;
    left:0; top:0; bottom:0;
    width:0%;
    background:linear-gradient(90deg, rgba(63,216,255,0.35), rgba(179,76,255,0.35));
    border-radius:12px 0 0 12px;
    transition:width .15s linear;
  }
  .btn-label{ position:relative; display:flex; align-items:center; gap:14px; }

  .toast{
    position:absolute;
    left:24px; right:24px; bottom:-14px;
    text-align:center;
    font-size:12px;
    color:var(--text-dim);
    opacity:0;
    transform:translateY(6px);
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{ opacity:1; transform:translateY(0); }
</style>
</head>
<body>

<div class="panel">

  <div class="header">
    <div class="logo">Aroha</div>
    <div class="header-icons">
      <button class="icon-btn" title="Settings" aria-label="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <div class="divider"></div>
      <button class="icon-btn close" title="Close" aria-label="Close" id="closeBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="url-field">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
    </svg>
    <input id="urlInput" type="text" placeholder="Paste URL here or search…">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>
      <line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/>
    </svg>
    <div class="divider"></div>
    <button class="icon-btn" id="pasteBtn" title="Paste" aria-label="Paste">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="8" y="2" width="8" height="4" rx="1"/>
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
      </svg>
    </button>
  </div>

  <div class="mode-toggle">
    <button class="mode-btn active" data-mode="video">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      Video
    </button>
    <button class="mode-btn" data-mode="audio">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      Audio
    </button>
  </div>

  <div class="section-label">QUALITY <span class="dots">••••</span><span class="rule"></span></div>
  <div class="field-row" id="qualityRow">
    <div class="left">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>
      <span id="qualityLabel">Best available</span>
    </div>
    <div class="right" id="qualityChevron">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
  </div>
  <div class="quality-menu" id="qualityMenu">
    <div data-val="Best available">Best available</div>
    <div data-val="2160p (4K)">2160p (4K)</div>
    <div data-val="1080p">1080p</div>
    <div data-val="720p">720p</div>
    <div data-val="480p">480p</div>
  </div>

  <div class="section-label">DOWNLOAD LOCATION <span class="dots">••••</span><span class="rule"></span></div>
  <div class="field-row" id="locationRow">
    <div class="left">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <span id="locationLabel">Downloads</span>
    </div>
    <div class="right">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
    </div>
  </div>

  <button class="download-btn" id="downloadBtn">
    <div class="progress-fill" id="progressFill"></div>
    <span class="btn-label">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span id="btnText">DOWNLOAD NOW</span>
    </span>
  </button>
  <div class="toast" id="toast"></div>

</div>

<script>
  // mode toggle
  document.querySelectorAll('.mode-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  // quality dropdown
  const qualityRow = document.getElementById('qualityRow');
  const qualityMenu = document.getElementById('qualityMenu');
  const qualityLabel = document.getElementById('qualityLabel');
  const qualityChevron = document.getElementById('qualityChevron');

  qualityRow.addEventListener('click', ()=>{
    qualityMenu.classList.toggle('open');
    qualityChevron.style.transform = qualityMenu.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
  });
  qualityMenu.querySelectorAll('div').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      qualityLabel.textContent = opt.dataset.val;
      qualityMenu.classList.remove('open');
      qualityChevron.style.transform = 'rotate(0deg)';
    });
  });

  // paste button
  document.getElementById('pasteBtn').addEventListener('click', async ()=>{
    try{
      const text = await navigator.clipboard.readText();
      if(text) document.getElementById('urlInput').value = text;
    }catch(e){ /* clipboard access unavailable in this context */ }
  });

  // fake download flow
  const downloadBtn = document.getElementById('downloadBtn');
  const progressFill = document.getElementById('progressFill');
  const btnText = document.getElementById('btnText');
  const toast = document.getElementById('toast');
  let downloading = false;

  downloadBtn.addEventListener('click', ()=>{
    if(downloading) return;
    const url = document.getElementById('urlInput').value.trim();
    if(!url){
      toast.textContent = 'Paste a URL to begin';
      toast.classList.add('show');
      setTimeout(()=>toast.classList.remove('show'), 1800);
      return;
    }
    downloading = true;
    downloadBtn.classList.add('busy');
    let pct = 0;
    const timer = setInterval(()=>{
      pct += Math.random()*18 + 6;
      if(pct >= 100){
        pct = 100;
        clearInterval(timer);
        btnText.textContent = 'DONE';
        toast.textContent = 'Saved to ' + document.getElementById('locationLabel').textContent;
        toast.classList.add('show');
        setTimeout(()=>{
          downloadBtn.classList.remove('busy');
          progressFill.style.width = '0%';
          btnText.textContent = 'DOWNLOAD NOW';
          toast.classList.remove('show');
          downloading = false;
        }, 2200);
      }
      progressFill.style.width = pct + '%';
      if(pct < 100) btnText.textContent = 'DOWNLOADING ' + Math.floor(pct) + '%';
    }, 220);
  });
</script>

</body>
</html>
